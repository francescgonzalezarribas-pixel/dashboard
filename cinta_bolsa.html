<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinta de bolsa — cripto en directo</title>
<style>
  :root{
    --bg:#0d1117; --panel:#131722; --border:#2a2e39;
    --up:#26a69a; --down:#ef5350; --gold:#f0b90b; --muted:#8a93a6; --fuerte:#ff9100;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100%; gap:16px; padding:16px;
  }
  h1{font-size:14px; font-weight:700; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; margin:6px 0 0;}
  .estado{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .punto{width:7px; height:7px; border-radius:50%; background:var(--muted);}
  .punto.on{background:var(--up); box-shadow:0 0 6px var(--up);}
  .punto.off{background:var(--down);}

  .cinta-wrap{
    width:100%; max-width:900px; overflow:hidden;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:14px 0;
  }
  .cinta{
    display:flex; gap:34px; white-space:nowrap;
    animation:desliza 95s linear infinite;
    width:max-content;
  }
  .cinta-wrap:hover .cinta{ animation-play-state:paused; }
  @keyframes desliza{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  .item{ display:flex; align-items:baseline; gap:9px; font-variant-numeric:tabular-nums; }
  .item.fuerte .sym{ color:var(--fuerte); }
  .sym{ font-weight:800; font-size:14.5px; color:#fff; }
  .precio{ font-weight:700; font-size:14.5px; }
  .cambio{ font-size:12px; font-weight:700; padding:1px 6px; border-radius:5px; }
  .cambio.pos{ color:var(--up); background:rgba(38,166,154,.12); }
  .cambio.neg{ color:var(--down); background:rgba(239,83,80,.12); }
  .llama{ font-size:12px; }

  /* Tabla de mayores movimientos del día */
  .destacados{
    width:100%; max-width:900px; background:var(--panel);
    border:1px solid var(--border); border-radius:10px; padding:14px 16px;
  }
  .destacados h2{font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:0 0 10px;}
  .fila{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .fila:last-child{ border-bottom:none; }
  .fila .izq{ display:flex; align-items:center; gap:8px; }
  .fila .sym2{ font-weight:700; }

  footer{font-size:11px; color:var(--muted); text-align:center; max-width:640px; line-height:1.5; margin-top:4px;}
  footer b{color:#ccc;}
</style>
</head>
<body>

  <h1>35 cripto — en directo</h1>
  <div class="estado"><span class="punto off" id="punto"></span><span id="estadoTxt">conectando…</span></div>

  <div class="cinta-wrap">
    <div class="cinta" id="cinta"></div>
  </div>

  <div class="destacados">
    <h2>🔥 Mayores movimientos de hoy</h2>
    <div id="listaDestacados">
      <div class="fila"><span class="izq">Esperando datos…</span></div>
    </div>
  </div>

  <footer>
    Precios en directo desde el WebSocket público de <b>Binance</b> (sin clave, sin servidor propio).
    En naranja, monedas que hoy se mueven más de un 5%. Solo informativo, no asesoramiento financiero.
  </footer>

<script>
// 35 criptos con par USDT activo en Binance (mismas que ya usa el bot en otros comandos)
const SIMBOLOS = [
  "BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","XRPUSDT","ADAUSDT","DOGEUSDT","AVAXUSDT",
  "LINKUSDT","DOTUSDT","TRXUSDT","LTCUSDT","SHIBUSDT","UNIUSDT","ATOMUSDT","XLMUSDT",
  "NEARUSDT","APTUSDT","ARBUSDT","OPUSDT","FILUSDT","ICPUSDT","HBARUSDT","VETUSDT",
  "ALGOUSDT","SUIUSDT","TONUSDT","INJUSDT","AAVEUSDT","MKRUSDT","ETCUSDT","BCHUSDT",
  "PEPEUSDT","WIFUSDT","HYPEUSDT"
];
const UMBRAL_FUERTE = 5; // % de cambio en 24h a partir del cual se destaca

const datos = {};
const cinta = document.getElementById("cinta");
const punto = document.getElementById("punto");
const estadoTxt = document.getElementById("estadoTxt");
const listaDestacados = document.getElementById("listaDestacados");

function decimales(p){ return p>=1000?0 : p>=100?1 : p>=1?2 : 4; }
function fmt(p){ return "$"+p.toLocaleString("en-US",{minimumFractionDigits:decimales(p),maximumFractionDigits:decimales(p)}); }

function pintarCinta(){
  cinta.innerHTML = "";
  const filas = SIMBOLOS.map(s=>datos[s]).filter(Boolean);
  if(!filas.length) return;
  [...filas, ...filas].forEach(d=>{
    const div = document.createElement("div");
    const esFuerte = Math.abs(d.pct) >= UMBRAL_FUERTE;
    div.className = "item" + (esFuerte ? " fuerte" : "");
    const cambioClase = d.pct>=0 ? "pos" : "neg";
    const flecha = d.pct>=0 ? "▲" : "▼";
    div.innerHTML = `
      ${esFuerte ? '<span class="llama">🔥</span>' : ""}
      <span class="sym">${d.symbol.replace("USDT","")}</span>
      <span class="precio">${fmt(d.price)}</span>
      <span class="cambio ${cambioClase}">${flecha} ${Math.abs(d.pct).toFixed(2)}%</span>`;
    cinta.appendChild(div);
  });
}

function pintarDestacados(){
  const filas = SIMBOLOS.map(s=>datos[s]).filter(Boolean);
  if(!filas.length) return;
  const top5 = [...filas].sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct)).slice(0,5);
  listaDestacados.innerHTML = top5.map(d=>{
    const cambioClase = d.pct>=0 ? "pos" : "neg";
    const flecha = d.pct>=0 ? "▲" : "▼";
    return `<div class="fila">
      <span class="izq"><span class="sym2">${d.symbol.replace("USDT","")}</span> ${fmt(d.price)}</span>
      <span class="cambio ${cambioClase}">${flecha} ${Math.abs(d.pct).toFixed(2)}%</span>
    </div>`;
  }).join("");
}

let ws;
function conectar(){
  const streams = SIMBOLOS.map(s=>s.toLowerCase()+"@ticker").join("/");
  ws = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);

  ws.onopen = ()=>{ punto.className="punto on"; estadoTxt.textContent="en directo (Binance)"; };
  ws.onclose = ()=>{ punto.className="punto off"; estadoTxt.textContent="reconectando…"; setTimeout(conectar,2000); };
  ws.onerror = ()=>{ ws.close(); };

  ws.onmessage = (ev)=>{
    try{
      const msg = JSON.parse(ev.data).data;
      datos[msg.s] = { symbol: msg.s, price: parseFloat(msg.c), pct: parseFloat(msg.P) };
      pintarCinta();
      pintarDestacados();
    }catch(e){}
  };
}
conectar();
</script>
</body>
</html>
